apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  steps:
    - name: cleanup
      image: alpine
      script: |
        #!/bin/sh
        rm -rf /workspace/source/*

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose-test
spec:
  steps:
    - name: test
      image: python:3.11
      script: |
        #!/bin/bash
        pip install -r /workspace/source/requirements.txt
        pip install nose
        cd /workspace/source
        nosetests
